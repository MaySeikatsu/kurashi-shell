[package]
name = "probe-gtk4"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
gtk4 = { version = "0.10", features = ["v4_12"] }
gtk4-layer-shell = "0.7"
serde_json = "1"
async-channel = "2"
glow = "0.16"
libloading = "0.8"
gdk4-wayland = { version = "0.10", features = ["wayland_crate"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
