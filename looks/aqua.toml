name = "aqua"
label = "config.choice.look.aqua"
category = "inspired"
# After shellseikatsu `Services/Modes/Macos.qml` and `Widgets/GlassSheen.qml` (W25): frosted, soft, deferential —
# graphite glass with a specular rim, squircles, smooth and never bouncy; SF Pro when installed, Inter otherwise.
[recipe]
"theme.chrome" = "soft"
"theme.motion.profile" = "expressive"
"theme.material.kind" = "glass"
"theme.material.opacity" = 0.6
"theme.shape.corners" = "squircle"
"theme.shape.radius" = 24
"theme.typography.family" = ["SF Pro Display", "SF Pro Text", "Helvetica Neue", "Inter", "Noto Sans CJK JP", "sans-serif"]
[slots]
frame = "sheen"
