name = "kanso"
label = "config.choice.look.kanso"
category = "modern"
# Kanso (簡素, simplicity): the shell's plain form — flat tonal blocks, even rounding, a light translucency, calm motion,
# a neutral sans. The look every other one is measured against (K53).
[recipe]
"theme.chrome" = "flat"
"theme.motion.profile" = "expressive"
"theme.material.kind" = "translucent"
"theme.material.opacity" = 0.85
"theme.shape.corners" = "rounded"
"theme.shape.radius" = 18
"theme.typography.family" = ["Inter", "Noto Sans CJK JP", "sans-serif"]

# W53.8 (docs/ux/styles.md "kanso"): a quiet cue set (round sine tones, a soft knock; off unless `theme.sounds`) and a plain
# arrow (off unless `cursor.theme = style`). Neither changes a pixel of the shell.
[slots]
sounds = "kanso"

[decor]
"cursor" = "kanso"
