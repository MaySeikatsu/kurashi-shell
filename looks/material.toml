name = "material"
label = "config.choice.look.material"
category = "modern"
# After shellseikatsu `Services/Modes/Material.qml` (W25): the M3 purist — opaque tonal surfaces carry depth, no
# shadows, constant rounding, emphasized damped easing, Roboto.
[recipe]
"theme.chrome" = "flat"
"theme.motion.profile" = "calm"
"theme.material.kind" = "solid"
"theme.shape.corners" = "rounded"
"theme.shape.radius_scale" = 1.0
"theme.typography.family" = ["Roboto", "Noto Sans CJK JP", "sans-serif"]
