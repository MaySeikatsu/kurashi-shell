name = "glass"
label = "config.choice.look.glass"
category = "modern"
# After Vitreus/pleamar: frosted glass, soft squircles with a light rim and a soft shadow, springs that settle.
[recipe]
"theme.chrome" = "soft"
"theme.motion.profile" = "lively"
"theme.material.kind" = "translucent"
"theme.material.blur" = true
"theme.material.opacity" = 0.62
"theme.shape.corners" = "squircle"
"theme.shape.radius" = 25
"theme.typography.family" = ["Inter", "Noto Sans CJK JP", "sans-serif"]

# W53.8 (docs/ux/styles.md "glass"): struck-glass chimes as cues (off unless `theme.sounds`) and a frosted arrow (off
# unless `cursor.theme = style`).
[slots]
sounds = "glass"

[decor]
"cursor" = "glass"
