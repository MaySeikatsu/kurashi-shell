name = "kami"
label = "config.choice.look.kami"
category = "inspired"
# A notebook page (K60): dotted paper you can feel, blocks outlined by hand in pen, a handwritten type. W53.7
# (docs/ux/styles.md §9): menus written right of the red margin rule, the chosen row underlined in the red pen; the scroll
# bar a pencil line; tooltips and toasts notes torn from the page; the lock a notebook page with a handwritten clock.
[recipe]
"theme.chrome" = "line"
# K83 D4 (the user): kami opens like origami — cards unfold, sidebars roll out, toasts fall in as a drop and leave crumpled.
"theme.motion.profile" = "origami"
"theme.material.kind" = "solid"
"theme.shape.corners" = "rounded"
"theme.shape.radius" = 13
"theme.typography.family" = ["Kalam", "Klee One", "cursive"]
"theme.typography.family_jp" = ["Klee One", "Noto Sans CJK JP", "sans-serif"]
# K104: a monospaced hand for terminals and code.
"theme.typography.mono" = ["Monaspace Radon", "JetBrains Mono", "monospace"]
"theme.texture.kind" = "paper_dots"
"theme.texture.strength" = 0.55
"theme.texture.tint" = true
# K61: the dots and fibres cast faint shadows; the pen swells and thins a little.
"theme.texture.shadows" = "on"
# Notebook sheets lie on the desk: they cast soft shadows away from the light (I338).
"theme.material.elevation" = "follow"
"theme.pen.pressure" = 0.35
# Every outline as its blocks' (session 17): the text's ink, sketched — the frame, the island, cards and sidebars too.
"theme.outline_ink" = "text"
"theme.pen.line" = "sketch"
[slots]
slider = "ink"
toggle = "stamp"
frame = "sketch"
menu = "margin"
scroll = "pencil"
tooltip = "note"
lock = "notebook"
sounds = "kami"

[decor]
# Doodled symbols sit on the page with a faint pencil shadow (I338).
"elevation.icons" = 0.5
# Menus: the content starts right of the margin rule (14 px of lead; the rule 9 px in), no band — the red pen underlines.
"menu.lead" = 14
"menu.highlight" = "bar"
"menu.separator" = "space"
"menu.radius" = 0
# A pencil line, 10 px of room.
"scroll.width" = 10
"cursor" = "kami"
