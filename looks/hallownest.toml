name = "hallownest"
label = "config.choice.look.hallownest"
category = "fiction"
# After shellseikatsu `Services/Modes/HollowKnight.qml` and `Widgets/ThemeDecor/HollowFrame.qml` (W25): pale
# bone line work on blue-grey fog, symmetrical filigree with a centre diamond, engraved capitals, drifting calm.
[recipe]
"theme.chrome" = "line"
"theme.motion.profile" = "expressive"
"theme.motion.speed" = 0.85
"theme.material.kind" = "translucent"
"theme.material.opacity" = 0.94
"theme.shape.corners" = "rounded"
"theme.shape.radius" = 11
"theme.typography.family" = ["Trajan Pro", "Cinzel", "Noto Serif", "Noto Serif CJK JP", "serif"]
[slots]
frame = "hollow"
