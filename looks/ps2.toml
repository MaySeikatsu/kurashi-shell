name = "ps2"
label = "config.choice.look.ps2"
category = "retro"
# After shellseikatsu `Services/Modes/Ps2.qml` and `Widgets/ThemeDecor/Ps2Frame.qml` (W25; the PS2 dashboard):
# void black, translucent light towers and blue glow lines, thin silver type, solemn calm motion.
[recipe]
"theme.chrome" = "soft"
"theme.motion.profile" = "expressive"
"theme.material.kind" = "translucent"
"theme.material.opacity" = 0.92
"theme.shape.corners" = "rounded"
"theme.shape.radius" = 9
"theme.typography.family" = ["SST", "Zrnic", "Inter", "Noto Sans CJK JP", "sans-serif"]
[slots]
frame = "ps2"
