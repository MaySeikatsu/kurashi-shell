name = "terminal"
label = "config.choice.look.terminal"
category = "modern"
# A terminal's honesty: ink outlines on mono, square corners, sharp icons, quick and calm.
[recipe]
"theme.chrome" = "line"
"theme.motion.profile" = "calm"
"theme.motion.speed" = 1.6
"theme.material.kind" = "solid"
"theme.shape.corners" = "none"
"theme.typography.family" = ["JetBrains Mono", "Noto Sans Mono CJK JP", "monospace"]
