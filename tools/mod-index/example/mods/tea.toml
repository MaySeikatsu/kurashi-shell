# An index entry (docs/ux/mod-catalogue.md "The index"): one file per mod, named by its id. This one describes the mod
# `kurashi mod new tea --name "Tea timer" --icon emoji_food_beverage --description "Steeping times in the bar."
# --with widget,peek,panel --host python` writes; its source is a placeholder (example.org serves no mod).
id = "tea"
name = { en = "Tea timer", ja = "お茶タイマー" }
description = { en = "Steeping times in the bar.", ja = "バーにお茶の抽出時間。" }
icon = "emoji_food_beverage"
author = "The Kurashi project"
homepage = "https://example.org/kurashi-tea"
license = "MIT"

[[version]]
version = "0.1.0"
shell = ">=0.5, <0.6"                       # the shell versions it was checked against
source = { git = "https://example.org/kurashi-tea", rev = "0000000000000000000000000000000000000000" }
hash = "sha256-lEsLvkuj8hfsyHPHnbhjLyXGB85Ocik749aEFj0rxF8="   # `kurashi mod hash <tree>` = `nix hash path <tree>`

# Written by the index's CI (`tools/mod-index/build.py summary <index> tea`), never by hand.
[version.summary]
provides = ["i18n", "widget:tea", "peek:tea", "panel:tea", "service:tea", "action:tea.poke"]
uses = []
capabilities = []
hosts = [{ name = "main", exec = "tea-host", start = "subscribed" }]
