[package]
name = "kurashi-probe-iced"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
iced_layershell = "0.19.1"
iced = { version = "0.14", features = ["tokio", "wgpu", "advanced"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt", "macros", "time", "sync"] }
futures = "0.3"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }

[profile.release]
opt-level = 2
debug = false
