[package]
name = "kurashi-probe-gpui"
version = "0.0.1"
edition = "2024"

[workspace]

[[bin]]
name = "probe-gpui"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "b5e03c7b0302894ac7a57d233be8d03dc9c81223", features = ["wayland"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "b5e03c7b0302894ac7a57d233be8d03dc9c81223", features = ["wayland"] }
serde_json = "1"
futures = "0.3"
anyhow = "1"
uuid = { version = "1", features = ["v5"] }
wayland-client = "0.31"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
debug = false
strip = true
