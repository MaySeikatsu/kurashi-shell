<!doctype html><html><head><meta charset="utf-8"><title>ready</title>
<style>body{background:#2b3a55;color:#f0e6d2;font:20px sans-serif;margin:24px}input{font:20px sans-serif;width:90%}</style></head>
<body><h1>Pin spike</h1><input id="i" autofocus placeholder="type here">
<p id="o">nothing typed</p>
<p id="s"></p>
<script>
const i=document.getElementById('i');
i.addEventListener('input',()=>{document.title='typed:'+i.value;document.getElementById('o').textContent='typed: '+i.value;console.log('INPUT '+i.value)});
let n=Number(localStorage.getItem('visits')||0)+1;localStorage.setItem('visits',n);document.getElementById('s').textContent='visits in this profile: '+n;console.log('VISITS '+n);
window.addEventListener('focus',()=>console.log('WINDOW-FOCUS'));
i.addEventListener('focus',()=>console.log('INPUT-FOCUS'));
</script></body></html>
