# Web dock (K38, W17): pins at a screen edge, each a site in the web host (`host:web`, the patched qs-webengine,
# K39) or a view of a mod. Off by default. Daemon code: crates/kurashi-mod-webdock (linked in native.rs); the host's
# QML: mods/webdock/host/ (W17-webdock-host). Pins are a records setting (K38, MODS.md "Records").
id = "webdock"
name = "Web dock"
description = "mods.webdock.description"
version = "0.1.0"
tier = "native"
kurashi = ">=0.0.1"
provides = [
    "service:webdock",
    "action:webdock.*",
    "host:web",
    "surface:dock",
    "widget:webdock",
    # W30: the dock as a sidebar tab or section (`mod:webdock:webdock`): pins on top, the page filling the pane.
    "panel:webdock",
    # Session 33 (K150): the launcher's prefix (`launcher_prefix`, `/`): open or search in the dock.
    "launcher:web",
    "i18n",
]
capabilities = ["network", "exec:qs-webengine", "exec:xdg-open", "fs:scoped"]
cost = "high"

# The pins (MODS.md "Web dock"): a site (`https`, `http`, `file`) or a mod's view (`mod:<id>:<panel>`). `view` and
# `profile` empty or `default` take `default_view` and the pin's own profile (its id).
[[setting]]
key = "pins"
type = "records"
default = []
unique = "id"
item_label = "title"
label = "mods.webdock.pins"
help = "mods.webdock.pins.help"
  [[setting.field]]
  key = "id"
  type = "string"
  required = true
  pattern = "slug"
  label = "mods.webdock.pins.id"
  [[setting.field]]
  key = "title"
  type = "string"
  required = true
  label = "mods.webdock.pins.title"
  [[setting.field]]
  key = "target"
  type = "url"
  required = true
  schemes = ["https", "http", "file", "mod"]
  label = "mods.webdock.pins.target"
  [[setting.field]]
  key = "view"
  type = "enum"
  choices = ["default", "mobile", "desktop"]
  default = "default"
  label = "mods.webdock.pins.view"
  [[setting.field]]
  key = "profile"
  type = "string"
  default = ""
  label = "mods.webdock.pins.profile"
  [[setting.field]]
  key = "icon"
  type = "string"
  default = ""
  label = "mods.webdock.pins.icon"
  # W73 (I488; docs/ux/webdock.md "Background pages"): never frozen while loaded, never unloaded by the dock's rules.
  [[setting.field]]
  key = "background"
  type = "bool"
  default = false
  label = "mods.webdock.pins.background"

[[setting]]
key = "default_view"
type = "enum"
default = "mobile"
choices = ["mobile", "desktop"]
label = "mods.webdock.default_view"
help = "mods.webdock.default_view.help"

[[setting]]
key = "width"
type = "int"
default = 412
range = [360, 720]
unit = "px"
label = "mods.webdock.width"

[[setting]]
key = "large"
type = "int"
default = 90
range = [50, 95]
unit = "%"
label = "mods.webdock.large"

# W69 (I468; docs/ux/webdock.md "Page styles"): how the card frames its page — a phone (a tablet lying sideways in the
# large size), one half of an opened spiral notebook, or the shell's plain card.
[[setting]]
key = "page_style"
type = "enum"
default = "phone"
choices = ["phone", "notebook", "plain"]
label = "mods.webdock.page_style"
help = "mods.webdock.page_style.help"

# W73 (I488; docs/ux/webdock.md "The card's size"): the page's size in the bar module's card, one for all pins. W74: the
# edge card's own size (`dock`: `width` × twice that) is the first choice and the default; the card's size key steps on.
[[setting]]
key = "card_size"
type = "enum"
default = "dock"
choices = ["dock", "phone", "tablet", "wide"]
label = "mods.webdock.card_size"
help = "mods.webdock.card_size.help"

# W76 (I496; docs/ux/webdock.md "Round three"): the card's box the user dragged, one row per output, written by the daemon
# (`webdock.resize`). The edge card in its own size and the bar card in `dock` take it; `width` × twice that otherwise.
[[setting]]
key = "sizes"
type = "records"
default = []
unique = "output"
item_label = "output"
label = "mods.webdock.sizes"
help = "mods.webdock.sizes.help"
  [[setting.field]]
  key = "output"
  type = "string"
  required = true
  label = "mods.webdock.sizes.output"
  [[setting.field]]
  key = "width"
  type = "int"
  required = true
  range = [300, 8192]
  label = "mods.webdock.sizes.width"
  [[setting.field]]
  key = "height"
  type = "int"
  required = true
  range = [300, 8192]
  label = "mods.webdock.sizes.height"

# W76 (I497): where words typed in the address field go (`{q}` the words; the daemon decides address or search).
[[setting]]
key = "search"
type = "string"
default = "https://duckduckgo.com/?q={q}"
label = "mods.webdock.search"
help = "mods.webdock.search.help"

# Session 33 (K150): the launcher prefix that opens an address or a search in the dock; empty: none.
[[setting]]
key = "launcher_prefix"
type = "string"
default = "/"
label = "mods.webdock.launcher_prefix"
help = "mods.webdock.launcher_prefix.help"

[[setting]]
key = "edge"
type = "enum"
default = "right"
choices = ["right", "left", "top", "bottom"]
label = "mods.webdock.edge"

[[setting]]
key = "unload_after"
type = "int"
default = 60
range = [0, 1440]
unit = "min"
label = "mods.webdock.unload_after"
help = "mods.webdock.unload_after.help"

[[setting]]
key = "max_loaded"
type = "int"
default = 4
range = [1, 12]
label = "mods.webdock.max_loaded"

# How the dock reveals and stays (user decisions, session 8, K40; docs/ux/webdock.md "Modes and transitions").
[[setting]]
key = "hover"
type = "bool"
default = true
label = "mods.webdock.hover"
help = "mods.webdock.hover.help"

# W74 (docs/ux/webdock.md "Which place shows the page"): a hover reveal of the edge takes a pin's page from the bar's
# card or the sidebar (on), or only a click, the dock's key or "Show here" does (off).
[[setting]]
key = "hover_takes_page"
type = "bool"
default = true
label = "mods.webdock.hover_takes_page"
help = "mods.webdock.hover_takes_page.help"

# I495 (session 30; the user: "show the active site right next to the pinned bar module", "shows the active current site
# playing music and their title"): the bar module's two views.
# Session 31 (the user: the sites' own images, I495): a page's icon is a request the page itself did not make (K38's
# privacy proof); on by default since the user asked for the images, off restores the letters and the strict proof.
[[setting]]
key = "site_icons"
type = "bool"
default = true
label = "mods.webdock.site_icons"
help = "mods.webdock.site_icons.help"

[[setting]]
key = "bar_site"
type = "bool"
default = false
label = "mods.webdock.bar_site"
help = "mods.webdock.bar_site.help"

[[setting]]
key = "bar_playing"
type = "bool"
default = false
label = "mods.webdock.bar_playing"
help = "mods.webdock.bar_playing.help"

[[setting]]
key = "reopen_last"
type = "bool"
default = true
label = "mods.webdock.reopen_last"
help = "mods.webdock.reopen_last.help"

[[setting]]
key = "pinned"
type = "bool"
default = false
label = "mods.webdock.pinned"
help = "mods.webdock.pinned.help"

[[setting]]
key = "reserve"
type = "bool"
default = false
label = "mods.webdock.reserve"
help = "mods.webdock.reserve.help"

[[setting]]
key = "indicator"
type = "bool"
default = true
label = "mods.webdock.indicator"

[[setting]]
key = "strip"
type = "int"
default = 56
range = [40, 64]
unit = "px"
label = "mods.webdock.strip"

[[setting]]
key = "new_tabs"
type = "enum"
default = "dock"
choices = ["dock", "browser"]
label = "mods.webdock.new_tabs"
help = "mods.webdock.new_tabs.help"

# W78 (I499; docs/ux/webdock.md "Local mode"): what the strip lists — every pin (online), or the shell's own views
# (local: notes, tasks, a timer, any mod's panel or desk card). The strip's switch writes it (`webdock.content`).
[[setting]]
key = "content"
type = "enum"
default = "online"
choices = ["online", "local"]
label = "mods.webdock.content"
help = "mods.webdock.content.help"
