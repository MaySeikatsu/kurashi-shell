# Web dock (K38, W17): pins at a screen edge, each a site in the web host (`host:web`, the patched qs-webengine,
# K39) or a view of a mod. Off by default. Daemon code: crates/kurashi-mod-webdock (linked in native.rs); the host's
# QML: mods/webdock/host/ (W17-webdock-host). Pins are a records setting (K38, MODS.md "Records").
id = "webdock"
name = "Web dock"
description = "mods.webdock.description"
version = "0.1.0"
tier = "native"
kurashi = ">=0.0.1"
provides = [
    "service:webdock",
    "action:webdock.*",
    "host:web",
    "surface:dock",
    "widget:webdock",
    "i18n",
]
capabilities = ["network", "exec:qs-webengine", "exec:xdg-open", "fs:scoped"]
cost = "high"

# The pins (MODS.md "Web dock"): a site (`https`, `http`, `file`) or a mod's view (`mod:<id>:<panel>`). `view` and
# `profile` empty or `default` take `default_view` and the pin's own profile (its id).
[[setting]]
key = "pins"
type = "records"
default = []
unique = "id"
item_label = "title"
label = "mods.webdock.pins"
  [[setting.field]]
  key = "id"
  type = "string"
  required = true
  pattern = "slug"
  label = "mods.webdock.pins.id"
  [[setting.field]]
  key = "title"
  type = "string"
  required = true
  label = "mods.webdock.pins.title"
  [[setting.field]]
  key = "target"
  type = "url"
  required = true
  schemes = ["https", "http", "file", "mod"]
  label = "mods.webdock.pins.target"
  [[setting.field]]
  key = "view"
  type = "enum"
  choices = ["default", "mobile", "desktop"]
  default = "default"
  label = "mods.webdock.pins.view"
  [[setting.field]]
  key = "profile"
  type = "string"
  default = ""
  label = "mods.webdock.pins.profile"
  [[setting.field]]
  key = "icon"
  type = "string"
  default = ""
  label = "mods.webdock.pins.icon"

[[setting]]
key = "default_view"
type = "enum"
default = "mobile"
choices = ["mobile", "desktop"]
label = "mods.webdock.default_view"
help = "mods.webdock.default_view.help"

[[setting]]
key = "width"
type = "int"
default = 412
range = [360, 720]
unit = "px"
label = "mods.webdock.width"

[[setting]]
key = "large"
type = "int"
default = 90
range = [50, 95]
unit = "%"
label = "mods.webdock.large"

[[setting]]
key = "edge"
type = "enum"
default = "right"
choices = ["right", "left", "top", "bottom"]
label = "mods.webdock.edge"

[[setting]]
key = "unload_after"
type = "int"
default = 60
range = [0, 1440]
unit = "min"
label = "mods.webdock.unload_after"
help = "mods.webdock.unload_after.help"

[[setting]]
key = "max_loaded"
type = "int"
default = 4
range = [1, 12]
label = "mods.webdock.max_loaded"

# How the dock reveals and stays (user decisions, session 8, K40; docs/ux/webdock.md "Modes and transitions").
[[setting]]
key = "hover"
type = "bool"
default = true
label = "mods.webdock.hover"
help = "mods.webdock.hover.help"

[[setting]]
key = "reopen_last"
type = "bool"
default = true
label = "mods.webdock.reopen_last"
help = "mods.webdock.reopen_last.help"

[[setting]]
key = "pinned"
type = "bool"
default = false
label = "mods.webdock.pinned"
help = "mods.webdock.pinned.help"

[[setting]]
key = "reserve"
type = "bool"
default = false
label = "mods.webdock.reserve"
help = "mods.webdock.reserve.help"

[[setting]]
key = "indicator"
type = "bool"
default = true
label = "mods.webdock.indicator"

[[setting]]
key = "strip"
type = "int"
default = 56
range = [40, 64]
unit = "px"
label = "mods.webdock.strip"

[[setting]]
key = "new_tabs"
type = "enum"
default = "dock"
choices = ["dock", "browser"]
label = "mods.webdock.new_tabs"
help = "mods.webdock.new_tabs.help"
