id = "lyrics"
name = "Lyrics"
description = "mods.lyrics.description"
version = "0.1.0"
tier = "native"
kurashi = ">=0.0.1"
# Synced lyrics for the track the media card shows (K47, docs/ux/lyrics.md): the service and its actions (the Rust crate
# registers them), the media card's lyrics slot, a bar widget and a desk card (QML). Lyrics come from LRCLIB
# (lrclib.net) and are cached per track in the mod's cache folder.
provides = [
    "service:lyrics",
    "action:lyrics.*",
    "slot:media.expanded.below",
    "widget:lyrics",
    "desk:lyrics",
]
capabilities = ["network", "fs:scoped"]
cost = "low"
icon = "lyrics"
# What it reads and calls beyond its own documents and actions (K154; `?` = it works without).
uses = ["action:island.expand", "action:media.set_position", "doc:svc.media"]

[[setting]]
key = "online"
type = "bool"
default = true
label = "mods.lyrics.online"
help = "mods.lyrics.online.help"

[[setting]]
key = "offset_ms"
type = "int"
default = 0
range = [-5000, 5000]
unit = "ms"
label = "mods.lyrics.offset_ms"
help = "mods.lyrics.offset_ms.help"

[[setting]]
key = "bar_line"
type = "bool"
default = true
label = "mods.lyrics.bar_line"
help = "mods.lyrics.bar_line.help"

# ---- The integration contract (K154, docs/MODS.md): every action declared; `command` makes it a `>` command.

[[action]]
id = "lyrics.retry"
label = "mod-lyrics.action.retry"
icon = "sync"
command = "lyrics"
no_args = true

[[menu]]
at = "module"
action = "lyrics.retry"

# K72: the variants it does not ship, and why.
[skips]
peek = "the line is the glance"
panel = "its view is the media card's (slot media.expanded.below)"
island-face = "the media face shows the song; the lyrics ride in its expanded view"
quick-tile = "nothing to switch"
