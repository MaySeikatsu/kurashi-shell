id = "timer"
name = "Timer"
description = "mods.timer.description"
version = "0.1.0"
tier = "native"
kurashi = ">=0.0.1"
# Countdown timers and a pomodoro cycle (K73, docs/ux/timer.md). The crate registers the document `mod.timer`, the actions
# `timer.*`, the deadline job (one daemon timer, the earliest end) and the island face's signals; the QML is every variant the
# module ships (K72): the glance, the peek, the panel (Stage card and sidebar section), the desk card, the island face with its
# expanded view, and the quick tile.
provides = [
    "service:timer",
    "action:timer.*",
    "job:deadline",
    "island-face:timer",
    "widget:timer",
    "peek:timer",
    "panel:timer",
    "desk:timer",
    "slot:quick.tiles",
]
# The end goes out as a notification on the session bus (the notification server the daemon serves).
capabilities = ["dbus:session"]
cost = "low"
icon = "timer"

[[setting]]
key = "presets"
type = "string"
default = "5,10,25"
label = "mods.timer.presets"
help = "mods.timer.presets.help"

[[setting]]
key = "focus_minutes"
type = "int"
default = 25
range = [1, 180]
unit = "min"
label = "mods.timer.focus_minutes"
help = "mods.timer.focus_minutes.help"

[[setting]]
key = "short_break_minutes"
type = "int"
default = 5
range = [1, 60]
unit = "min"
label = "mods.timer.short_break_minutes"
help = "mods.timer.short_break_minutes.help"

[[setting]]
key = "long_break_minutes"
type = "int"
default = 15
range = [1, 120]
unit = "min"
label = "mods.timer.long_break_minutes"
help = "mods.timer.long_break_minutes.help"

[[setting]]
key = "rounds"
type = "int"
default = 4
range = [1, 12]
label = "mods.timer.rounds"
help = "mods.timer.rounds.help"

[[setting]]
key = "auto_advance"
type = "bool"
default = true
label = "mods.timer.auto_advance"
help = "mods.timer.auto_advance.help"

[[setting]]
key = "sound"
type = "bool"
default = true
label = "mods.timer.sound"
help = "mods.timer.sound.help"

# ---- The integration contract (K154, docs/MODS.md): every action declared; `command` makes it a `>` command.

[[action]]
id = "timer.add"
label = "mod-timer.action.add"

[[action]]
id = "timer.pause"
label = "mod-timer.action.pause"

[[action]]
id = "timer.pomodoro.start"
label = "mod-timer.action.pomodoro"
icon = "self_improvement"
command = "pomodoro"
no_args = true

[[action]]
id = "timer.resume"
label = "mod-timer.action.resume"

[[action]]
id = "timer.skip"
label = "mod-timer.action.next"

[[action]]
id = "timer.start"
label = "mod-timer.action.start"
icon = "timer"
command = "timer"
  [[action.arg]]
  name = "minutes"
  type = "int"
  range = [1, 1440]
  optional = true
  rest = true
  [[action.arg]]
  name = "seconds"
  type = "int"
  range = [1, 86400]
  optional = true
  [[action.arg]]
  name = "label"
  type = "string"
  optional = true

[[action]]
id = "timer.stop"
label = "mod-timer.action.stop"

[[action]]
id = "timer.stop_all"
label = "mod-timer.action.stop_all"
icon = "timer_off"
command = "stop timers"
no_args = true

[[menu]]
at = "module"
action = "timer.start"

[[menu]]
at = "module"
action = "timer.start"
args = { minutes = 5 }

[[menu]]
at = "module"
action = "timer.pomodoro.start"

[[menu]]
at = "module"
action = "timer.stop_all"
