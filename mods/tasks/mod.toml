id = "tasks"
name = "Tasks"
description = "mods.tasks.description"
version = "0.1.0"
tier = "native"
kurashi = ">=0.0.1"
# A Markdown checklist and a note in files the user owns (K46, docs/ux/tasks.md): the service and its actions (the Rust
# crate registers them), two desk cards, the bar widget and the panel (QML).
provides = [
    "service:tasks",
    "action:tasks.*",
    "desk:tasks",
    "desk:notes",
    "widget:tasks",
    "panel:tasks",
]
# The two files may be anywhere the settings point (a vault); `fs:scoped` is the nearest capability the daemon knows
# (CONTRACT-CHANGE row: a capability for user-named files).
capabilities = ["fs:scoped"]
cost = "low"
icon = "checklist"
# What it reads and calls beyond its own documents and actions (K154; `?` = it works without).
uses = ["doc:svc.clock"]

[[setting]]
key = "file"
type = "string"
default = ""
label = "mods.tasks.file"
help = "mods.tasks.file.help"

[[setting]]
key = "notes_file"
type = "string"
default = ""
label = "mods.tasks.notes_file"
help = "mods.tasks.notes_file.help"

[[setting]]
key = "show_done"
type = "bool"
default = true
label = "mods.tasks.show_done"
help = "mods.tasks.show_done.help"

[[setting]]
key = "bar_count"
type = "bool"
default = false
label = "mods.tasks.bar_count"
help = "mods.tasks.bar_count.help"

# ---- The integration contract (K154, docs/MODS.md): every action declared; `command` makes it a `>` command.

[[action]]
id = "tasks.add"
label = "mod-tasks.action.add"
icon = "add_task"
command = "task"
  [[action.arg]]
  name = "text"
  type = "string"
  rest = true

[[action]]
id = "tasks.clear_done"
label = "mod-tasks.action.clear_done"
icon = "playlist_remove"
command = "clear done tasks"
no_args = true

[[action]]
id = "tasks.edit"
label = "mod-tasks.action.edit"

[[action]]
id = "tasks.notes.set"
label = "mod-tasks.action.notes_set"

[[action]]
id = "tasks.remove"
label = "mod-tasks.action.remove"

[[action]]
id = "tasks.toggle"
label = "mod-tasks.action.toggle"

[[menu]]
at = "module"
action = "tasks.clear_done"

# K72: the variants it does not ship, and why.
[skips]
peek = "the count is the glance; the list is the panel"
island-face = "tasks have no live activity"
quick-tile = "nothing to switch"
