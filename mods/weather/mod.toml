id = "weather"
name = "Weather"
description = "mods.weather.description"
version = "0.1.0"
tier = "native"
kurashi = ">=0.0.1"
# Bar widget, panel, rain-soon face (Island), clock aside and clock day marks (K28 slots), saved-place choices,
# the mod service and its actions (docs/ux/weather.md), the rain-alerts job (I23). Each must be registered
# by the Rust crate.
provides = [
    "service:weather",
    "action:weather.*",
    "island-face:weather",
    "choices:weather.places",
    "job:rain",
    "widget:weather",
    "peek:weather",
    "panel:weather",
    "slot:clock.expanded.aside",
    "slot:clock.expanded.daymark",
    "location:weather",
    "desk:weather",
]
capabilities = ["network", "fs:scoped"]
cost = "low"
icon = "partly_cloudy_day"

[[setting]]
key = "place"
type = "string"
default = ""
choices_from = "weather.places"
label = "mods.weather.place"
help = "mods.weather.place.help"

[[setting]]
key = "units"
type = "enum"
default = "auto"
choices = ["auto", "metric", "imperial"]
label = "mods.weather.units"

[[setting]]
key = "refresh"
type = "int"
default = 30
range = [10, 180]
unit = "min"
label = "mods.weather.refresh"
help = "mods.weather.refresh.help"

[[setting]]
key = "rain_alerts"
type = "bool"
default = false
label = "mods.weather.rain_alerts"
help = "mods.weather.rain_alerts.help"

[[setting]]
key = "bar_template"
type = "string"
default = "{glyph} {temp}"
label = "mods.weather.bar_template"
help = "mods.weather.bar_template.help"

# ---- The integration contract (K154, docs/MODS.md): every action declared; `command` makes it a `>` command.

[[action]]
id = "weather.place.add"
label = "mod-weather.action.add"

[[action]]
id = "weather.place.move"
label = "mod-weather.action.move"

[[action]]
id = "weather.place.next"
label = "mod-weather.action.next"
icon = "location_on"
command = "next place"
no_args = true

[[action]]
id = "weather.place.preview"
label = "mod-weather.action.preview"

[[action]]
id = "weather.place.remove"
label = "mod-weather.action.remove"

[[action]]
id = "weather.place.search"
label = "mod-weather.action.search"

[[action]]
id = "weather.refresh"
label = "mod-weather.action.refresh"
icon = "sync"
command = "weather"
no_args = true

[[menu]]
at = "module"
action = "weather.refresh"

[[menu]]
at = "module"
action = "weather.place.next"

# K72: the variants it does not ship, and why.
[skips]
quick-tile = "nothing to switch"
