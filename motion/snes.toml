# SNES — Mosaic: a window resolves out of the console's mosaic in held steps, as its fades did (S21: the style's own
# animation; before, FF6's stepped box).
name = "snes"
base = "expressive"

[timing]
open = "steps(8)"
open_ms = 270
close = "steps(8)"
close_ms = 220
fast_ms = 50
effects_ms = 50
[form]
open = "pixelate"
close = "pixelate"

# (a stepped form picked over snes holds one frame per step, as FF6's box did)
[params.stepped]
hold = 1

[accents]
