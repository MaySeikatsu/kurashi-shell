# Vibrancy (macOS 11–14) — Motion: popovers and Control Centre modules zoom and fade from their source on springs.
# Moved from looks/vibrancy.toml's `[decor] motion.*` (W53, K80) unchanged (K83).
name = "vibrancy"
base = "calm"

[timing]


[form]
open = "zoom"
close = "zoom"
# K83 D4 (the user): the dock and toasts pour out of and back into their source like the Genie effect.
[form.dock]
open = "genie"
close = "genie"
[form.toast]
open = "genie"
close = "genie"

[accents]
