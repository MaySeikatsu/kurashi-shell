# Aero (7) — Motion: windows and flyouts fade in with a short zoom from 0.95 (~200 ms), out faster.
# Moved from looks/aero.toml's `[decor] motion.*` (W53, K80) unchanged (K83).
name = "aero"
base = "expressive"

[timing]
open = "cubic-bezier(0.1, 0.9, 0.2, 1)"
open_ms = 200
close = "ease-in"
close_ms = 150
fast = "cubic-bezier(0.1, 0.9, 0.2, 1)"
fast_ms = 150

[form]
open = "zoom"
close = "zoom"

[accents]
