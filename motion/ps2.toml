# PS2 — the glowing orb: panels open as a circle from where they were pressed, slowly (S21: the style's own animation).
# Timing from looks/ps2.toml's motion (W53, K80).
name = "ps2"
base = "expressive"

[timing]
open = "ease-in-out"
open_ms = 500
close = "ease-in-out"
close_ms = 450
fast = "ease-in-out"
fast_ms = 400
effects = "ease-in-out"
effects_ms = 400

[form]
open = "iris"
close = "iris"

