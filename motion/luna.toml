# Luna — Windows XP: menus slide out of their edge, quickly (S21: the style's own animation; before, short fades).
# Timing from looks/luna.toml's motion (W53, K80).
name = "luna"
base = "expressive"

[timing]
open = "ease"
open_ms = 200
close = "ease-in"
close_ms = 150
fast = "ease"
fast_ms = 150

[form]
open = "slide"
close = "slide"

