# Windows 95: the zoom rectangle — a window's outline steps out of where it was opened, then the window is there; on
# a linear clock, as the original (S21: the style's own animation; before, no animation at all).
name = "win95"
base = "expressive"

[timing]
open = "cubic-bezier(0, 0, 1, 1)"
open_ms = 220
close = "cubic-bezier(0, 0, 1, 1)"
close_ms = 180
fast = "cubic-bezier(0, 0, 1, 1)"
fast_ms = 120

[form]
open = "outline"
close = "outline"

[accents]
