# Aqua — Mac OS X: panels pour out of the button that opened them and back into it, like the Dock's genie (S21: the
# style's own animation everywhere). Timing from looks/aqua.toml's motion (W53, K80).
name = "aqua"
base = "expressive"

[timing]
open = "ease"
open_ms = 250
close = "ease-in"
close_ms = 200
fast = "ease"
fast_ms = 150

[form]
open = "genie"
close = "genie"
# K83 D4 (the user): the dock and toasts pour out of and back into their source like the Genie effect.
[form.dock]
open = "genie"
close = "genie"
[form.toast]
open = "genie"
close = "genie"

[accents]
