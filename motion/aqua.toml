# Aqua (Mac OS X 10.2–10.4) — Motion: sheets slide down out of the bar (~250 ms, ease out); menus and panels fade out.
# Moved from looks/aqua.toml's `[decor] motion.*` (W53, K80) unchanged (K83).
name = "aqua"
base = "expressive"

[timing]
open = "ease"
open_ms = 250
close = "ease-in"
close_ms = 200
fast = "ease"
fast_ms = 150

[form]
open = "slide"
close = "slide"
# K83 D4 (the user): the dock and toasts pour out of and back into their source like the Genie effect.
[form.dock]
open = "genie"
close = "genie"
[form.toast]
open = "genie"
close = "genie"

[accents]
