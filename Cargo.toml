[workspace]
resolver = "3"
members = ["crates/*"]   # glob: parallel task crates never conflict here

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://example.invalid/kurashi-shell"
rust-version = "1.85"

[workspace.dependencies]
kurashi-core = { path = "crates/kurashi-core" }
kurashi-ipc = { path = "crates/kurashi-ipc" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# K153 (session 34, docs/BENCH.md "Build loop"): line tables keep backtraces with file and line and nearly halve the
# build dir (the three binaries: 4.7 GB → 2.7 GB); a debugger session that needs variables sets
# CARGO_PROFILE_DEV_DEBUG=full for that build.
[profile.dev]
debug = "line-tables-only"

# The material generators run whole images through loops: unoptimised, six of their tests took 1.5–4 min each and were
# most of `just check`'s test time.
[profile.dev.package.kurashi-texture]
opt-level = 2

# W90 (K157): jemalloc's configure cannot compile its probes at -O0 under Nix's hardening flags (_FORTIFY_SOURCE wants
# optimisation: "cannot determine return type of strerror_r"); the allocator is built optimised in every profile.
[profile.dev.package.tikv-jemalloc-sys]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
