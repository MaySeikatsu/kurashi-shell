[workspace]
resolver = "3"
members = [
    "crates/kurashi-core",
    "crates/kurashi-ipc",
    "crates/kurashid",
    "crates/kurashi-mock",
    "crates/kurashi",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://example.invalid/kurashi-shell"
rust-version = "1.85"

[workspace.dependencies]
kurashi-core = { path = "crates/kurashi-core" }
kurashi-ipc = { path = "crates/kurashi-ipc" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
