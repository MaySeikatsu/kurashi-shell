"mods.ai.key_secret.help" = "Attributes of a keyring entry, e.g. service openai. Store the key with: secret-tool store --label='AI key' service openai. Looked up before the variable."
"mods.ai.anthropic_url" = "Anthropic address"
"mods.ai.anthropic_url.help" = "The API's base address."
