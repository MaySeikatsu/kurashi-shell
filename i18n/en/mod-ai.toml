# AI mod (en): the settings of mods/ai, the daemon's action and error keys, and the copy of the panel
# (docs/ux/ai.md). Placeholders in braces are filled by the frontend.

# The mod in the catalogue and its settings (mods/ai/mod.toml).
"mods.ai.description" = "A chat with a language model in a Stage panel. Local first: your own Ollama server; an OpenAI-compatible server or Anthropic when you choose one. Conversations stay on this computer."
"mods.ai.provider" = "Provider"
"mods.ai.provider.help" = "Who answers. Ollama runs on this computer; with the others your messages are sent to their server."
"mods.ai.provider.ollama" = "Ollama"
"mods.ai.provider.openai" = "OpenAI-compatible"
"mods.ai.provider.anthropic" = "Anthropic"
