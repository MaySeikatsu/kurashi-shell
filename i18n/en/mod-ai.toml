"mods.ai.ollama_model" = "Ollama model"
"mods.ai.ollama_model.help" = "A model you pulled, e.g. llama3.2. Empty: the one you used last, else the first installed. The panel's model picker sets it too and is remembered."
"mods.ai.openai_url" = "OpenAI-compatible address"
"mods.ai.openai_url.help" = "The API's base address, ending before /chat/completions: OpenAI, OpenRouter, Mistral, llama.cpp, LM Studio, vLLM…"
