# System monitor mod (en): catalogue, settings, actions, daemon refusals, and the bar, panel and face copy.
# Placeholders are {name}; the views fill them in.

"mods.sysmon.description" = "CPU, memory, temperature and GPU at a glance. Quiet while fine; when a level stays critical it names the culprit, and a process can be ended from the list."

# Settings (mods/sysmon/mod.toml)
"mods.sysmon.interval" = "Sampling interval"
"mods.sysmon.interval.help" = "How often the bar and the panel update. Nothing is sampled while neither is open."
"mods.sysmon.show_cpu" = "Show CPU in the bar"
"mods.sysmon.show_mem" = "Show memory in the bar"
"mods.sysmon.show_temp" = "Show temperature in the bar"
"mods.sysmon.show_load" = "Show load average in the bar"
"mods.sysmon.temp_sensor" = "Temperature sensor"
"mods.sysmon.temp_sensor.help" = "auto takes the CPU package sensor. Or name a hardware monitor, such as k10temp."
"mods.sysmon.watch" = "Watch for sustained trouble"
"mods.sysmon.watch.help" = "Samples every 10 seconds while this mod is on, even with no bar or panel open. Raises the Island face when a level stays critical."
"mods.sysmon.sustain" = "Critical for"
"mods.sysmon.sustain.help" = "How long a level must stay critical before the face appears."
"mods.sysmon.level.help" = "Above this the bar tints (activity); staying above the critical level shows the face. 0 turns the level off."
"mods.sysmon.cpu_activity" = "CPU: activity from"
"mods.sysmon.cpu_critical" = "CPU: critical from"
"mods.sysmon.mem_activity" = "Memory: activity from"
"mods.sysmon.mem_critical" = "Memory: critical from"
"mods.sysmon.temp_activity" = "Temperature: activity from"
"mods.sysmon.temp_critical" = "Temperature: critical from"

