# Tasks mod (en): the settings of mods/tasks, the daemon's state, reason and action keys, and the copy of the desk cards,
# the panel and the bar widget (docs/ux/tasks.md). Placeholders in braces are filled by the frontend.

# The mod in the catalogue and its settings (mods/tasks/mod.toml).
"mods.tasks.description" = "A to-do list and a note on the desk and in a panel, kept in plain Markdown files you can also edit elsewhere, for example in your Obsidian vault."
"mods.tasks.file" = "Tasks file"
"mods.tasks.file.help" = "A Markdown file with - [ ] items. Empty uses tasks.md in the shell's data folder. ~/ means your home folder. Obsidian Tasks dates (📅) and priorities (⏫ 🔼 🔽) are read and kept."
"mods.tasks.notes_file" = "Note file"
"mods.tasks.notes_file.help" = "The Markdown file the note is kept in. Empty uses notes.md in the shell's data folder."
"mods.tasks.show_done" = "Keep today's done tasks"
"mods.tasks.show_done.help" = "Tasks you tick today stay in the list, struck through, until tomorrow."
"mods.tasks.bar_count" = "Open count in the bar"
"mods.tasks.bar_count.help" = "The bar widget shows how many tasks are open."

