# W73 (docs/ux/webdock.md "Background pages", "The card's size", "Which place shows the page").
"mods.webdock.pins.background" = "Keep running in the background"
"mods.webdock.pins.help" = "A pin set to keep running in the background is never frozen or unloaded by the dock once you opened it: it keeps playing and working while hidden, and holds the web engine in memory and on the CPU until you turn it off. A site that plays sound keeps running for 10 minutes after its last sound anyway."
"mods.webdock.card_size" = "Card size in the bar"
"mods.webdock.card_size.help" = "The size of the page in the bar module's card. As at the edge: the size of the dock's card at the screen's edge, as wide as the phone width and twice as tall. Phone, Tablet, Wide: a phone's, a tablet's or a small laptop's screen. It shrinks to fit the screen. The size key in the card steps through them. The pin's view (mobile or desktop) is what the site is told: a desktop view in the phone size shows a desktop page at phone width."
"mods.webdock.card_size.dock" = "As at the edge"
