"config.theme.colors.media.blend_ms.help" = "色相環は道のりが長いので、1.5 倍の時間をかけます。"
"config.theme.colors.wallpaper_grade.enabled.label" = "壁紙カラーグレード"
"config.theme.colors.wallpaper_grade.enabled.help" = "テーマの色が変わるたびに（ダイナミックメディアカラーでも）、壁紙をテーマの色に染め直します。絵の細部は残り、元のファイルは変更しません。オフにすると元に戻ります。壁紙 mod が必要です。"
"config.theme.colors.wallpaper_grade.mode.label" = "染め方"
"config.theme.colors.wallpaper_grade.mode.help" = "自動では、色の多い絵は色をテーマの色に対応させ、色の少ない絵は影から明部までテーマの色でたどります。"
