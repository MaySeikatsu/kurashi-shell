"config.theme.window_frame_color.label" = "ウィンドウ枠の色"
"config.theme.window_frame_color.help" = "色を合わせるコンポジター（niri、Hyprland、MangoWM、sway）で、フォーカス中のウィンドウを囲む色。アクセント、シェルの輪郭の色（枠とシェルの輪郭が同じ色になります）、またはパレットの色から選べます。フォーカスのないウィンドウはアウトラインの色、注意を求めるウィンドウはエラーの色のままです。"
"config.choice.window_frame_color.accent" = "アクセント"
"config.choice.window_frame_color.shell_outline" = "シェルの輪郭"
