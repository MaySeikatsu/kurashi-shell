"config.choice.wallpaper_grade_mode.gradient" = "グラデーションマップ"
"config.choice.wallpaper_grade_mode.palette" = "パレットへ寄せる"
"config.theme.colors.wallpaper_grade.strength.label" = "強さ"
"config.theme.colors.wallpaper_grade.strength.help" = "元の絵から、完全に染めた状態まで。"
"config.theme.colors.wallpaper_grade.lightness.label" = "テーマの明るさに従う"
"config.theme.colors.wallpaper_grade.lightness.help" = "0 では絵の明暗を保ちます。上げると、暗いテーマでは絵が暗く、明るいテーマでは明るくなります。"
"config.theme.colors.scheme.label" = "ライト／ダーク"
"config.theme.colors.scheme.help" = "どのパレットにも両方あります。システムの設定、壁紙の明るさに従うか、どちらかを選びます。スタイルを適用するとスタイルに従い、「…に戻す」で自分の選択に戻ります（K55）。"
"config.theme.colors.extraction.label" = "壁紙の色の取り方"
"config.theme.colors.extraction.help" = "壁紙の色をどうパレットにするか。トーン合わせは主な色の周りに落ち着いた階調を作り、ビビッドは同じで彩度を上げ、プロミネントは絵にある色をそのまま使い（暗い色と明るい色を地と文字に、強い色相をアクセントに）、ミックスは絵の目立つ色すべてをシェル全体（地、カード、線、アクセント）に配ります。どのモードでも文字は読みやすく保たれます。季節の色合いがオンのときは、これらの色相もずらされます。"
"config.choice.extraction.tone_matched" = "トーン合わせ"
"config.choice.extraction.vibrant" = "ビビッド"
"config.choice.extraction.prominent" = "プロミネント"
"config.choice.extraction.mixed" = "ミックス"
"config.theme.colors.controls.label" = "操作部品の色"
"config.theme.colors.controls.help" = "ひとつのアクセント：ボタン、スライダー、スイッチ、タイルすべてアクセント色。散らす：パレットの色を配ります（ボタンはアクセント、スライダーはセカンダリ、スイッチとクイックタイルはターシャリ）。壁紙のほかの色がそのまま見えます。自動は壁紙のミックスのときに散らします。"
"config.choice.control_colours.auto" = "自動"
"config.choice.control_colours.one" = "ひとつのアクセント"
"config.choice.control_colours.spread" = "散らす"
"config.theme.colors.app_icons.label" = "アプリのアイコン"
"config.theme.colors.app_icons.help" = "ドック、バーのウィンドウ一覧、トレイ、ランチャー、通知のアプリのアイコン：そのまま、文字の色（絵は濃淡のインクで残ります）、パレットのトーン（暗から明へパレットの色で）、またはパレットの色（各部分がその色相に近いパレットの色になります）。"
"config.choice.app_icon_tint.original" = "そのまま"
"config.choice.app_icon_tint.ink" = "文字の色"
"config.choice.app_icon_tint.tones" = "パレットのトーン"
"config.choice.app_icon_tint.palette" = "パレットの色"
"config.theme.colors.chrome_fill.label" = "クロームの塗り"
"config.theme.colors.chrome_fill.help" = "バー、フレーム、パネル、カード（とテーマに従うアプリ）を何で塗るか。ニュートラル：パレットのグレー・黒・白。強い色：パレットの強い色。文字と操作部品は読みやすいよう選び直されます。下のグラデーションはどちらの上にも流せます。"
