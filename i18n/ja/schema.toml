"config.theme.light.outputs.help" = "ポインターの光と、それで向きが変わる影が働く場所。ポインターのあるモニターだけ、またはすべてのモニター（モニター全体でのポインターの位置から）。すべての場合、ポインターが動くたびに全モニターの面を描き直します。"
"config.choice.light_outputs.pointer" = "ポインターのあるモニター"
"config.choice.light_outputs.all" = "すべてのモニター"
"config.theme.typography.mono.label" = "等幅フォント"
"config.theme.typography.mono.help" = "ターミナルとコード用：フォールバックの順で、最初にインストールされているものを使います。アプリの等幅フォントがオンのとき、アプリも使います。"
"config.theme.browser_material_strength.label" = "ブラウザーの素材の強さ"
"config.theme.browser_material_strength.help" = "ブラウザーの画面の枠に出るタイルの強さ（シェル自身に対して）。枠には文字が少ないので、ターミナルより強くできます。ブラウザーの再起動後に反映されます。"
"config.theme.export_fonts.label" = "アプリのフォント"
"config.theme.export_fonts.help" = "テーマに従うアプリがシェルのフォントを使います：GTK・Qt・KDE のアプリ、Vesktop、Obsidian、Zen と Firefox の画面（とページの既定フォント）にはシェルのフォントを、ターミナル（Ghostty、Kitty、WezTerm、Foot、Alacritty）とデスクトップのコード用フォントには等幅フォント（フォントのページ）を。ターミナルのサイズはそのまま。フォントがあなた自身のファイルにあるアプリ（Spotify の user.css、Zed の設定）は自分のフォントのままで、設定にそう表示します。オフ：各アプリは自分のフォントのまま。"
"config.theme.export_fonts_pages.label" = "ウェブサイトにも"
"config.theme.export_fonts_pages.help" = "Zen と Firefox のページが、ページ自身のフォントの代わりにシェルのフォントを使います。アイコンをフォントで描くサイトでは、アイコンの代わりに文字や四角が出ます。ブラウザーの再起動後に反映されます。"
"config.launcher.logo_tint.label" = "ロゴの色"
"config.launcher.logo_tint.help" = "OSのロゴや自分の画像を、ルックの描き方で、そのまま、文字の色で、パレットの色を区画で（PS2のルックの四色のように）、またはパレットのトーンで（絵を保ったまま暗から明へ）。"
"config.choice.logo_tint.look" = "ルックのとおり"
"config.choice.logo_tint.original" = "そのまま"
"config.choice.logo_tint.ink" = "文字の色"
"config.choice.logo_tint.palette" = "パレットの色"
"config.choice.logo_tint.tones" = "パレットのトーン"
