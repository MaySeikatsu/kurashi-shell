"config.choice.window_frame_color.on_surface" = "文字"
"config.theme.window_frame.help" = "色を合わせるコンポジター（niri、Hyprland、MangoWM、sway）がすべてのウィンドウに枠を描きます。フォーカス中はアクセント色、ほかはアウトラインの色で、太さはシェルのアウトラインと同じです。オフ：各コンポジターの枠の設定はそのままで、色だけを合わせます。"
"config.theme.browser_material.label" = "ブラウザの質感"
"config.theme.browser_material.help" = "Zen と Firefox のサイドバーとツールバーに質感をタイルで敷き、角もシェルに合わせます。タイルは不透明なので、半透明のブラウザーがオンの間は使いません。ブラウザは起動時にクロームを読むので、再起動で反映されます。"
"config.theme.browser_translucent.label" = "透明なブラウザ"
"config.theme.browser_translucent.help" = "Zen と Firefox のインターフェースからウィンドウの下が透けます。Zen は透明設定が必要で、リンクしたプロファイルに書き込みます。再起動で反映されます。"
"config.theme.browser_translucent_pages.label" = "透明なページ"
"config.theme.browser_translucent_pages.help" = "背景を持たないページからもウィンドウの下が透けます。白いページを前提とするサイトが多いので、別のオプトインです。再起動で反映されます。"
"config.theme.inactive_transparent.label" = "フォーカス外のウィンドウを半透明に"
"config.theme.inactive_transparent.help" = "色を合わせるコンポジターが、フォーカス中以外のウィンドウを少し透明にします（niri、Hyprland、MangoWM。swayにはこの設定がありません）。オフ：各コンポジターの設定のままです。"
"config.theme.inactive_opacity.label" = "フォーカス外の不透明度"
"config.theme.window_animations.label" = "ウィンドウのアニメーション"
"config.theme.window_animations.help" = "色を合わせるコンポジターが、シェルの動きでウィンドウを開閉・移動します。niriはばね、HyprlandとMangoWMはシェルのカーブと長さ（swayにはアニメーションがありません）。オフ：各コンポジターの設定のままです。"
"config.theme.window_titlebars.label" = "タイトルバー"
"config.theme.window_titlebars.help" = "タイトルバーを描くコンポジターが、シェルの色とフォントを使います。swayは自前のもの、Hyprlandはhyprbarsプラグイン経由（読み込みが必要）。niriとMangoWMはタイトルバーを描かず、アプリが自分で描きます（色はGTKとQtに合わせたもの）。オフ：各コンポジターの設定のままです。"
