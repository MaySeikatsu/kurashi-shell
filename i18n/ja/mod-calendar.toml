"mods.calendar.sources" = "カレンダー"
"mods.calendar.sources.help" = ".ics ファイル、そのフォルダー（vdirsyncer や khal の保存フォルダー：サブフォルダーごとに1つのカレンダー）、または https:// か webcal:// で始まるアドレス。~/ はホームフォルダーです。"
