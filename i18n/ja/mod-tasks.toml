"mods.tasks.file.help" = "- [ ] の項目がある Markdown ファイル。空ならシェルのデータフォルダーの tasks.md。~/ はホームフォルダー。Obsidian Tasks の日付（📅）と優先度（⏫ 🔼 🔽）は読み取り、そのまま残します。"
"mods.tasks.notes_file" = "メモのファイル"
"mods.tasks.notes_file.help" = "メモを保存する Markdown ファイル。空ならシェルのデータフォルダーの notes.md。"
