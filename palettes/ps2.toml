# PS2 — the dashboard void: black with a deep blue glow, silver-white text. Dark, and light (K53). Roles after shellseikatsu
# `_ps2Palette()` (W25, K50). Meant for decor `ps2` (frame `ps2`).
name = "ps2"
kind = "pair"
description = "Void black and tower blue (decor ps2)"

[dark]
surface = "#000000"                   # the void (measured pure black on the main menu)
surface_container_lowest = "#040609"
surface_container_low = "#080a10"
surface_container = "#10141f"
surface_container_high = "#181e2e"
surface_container_highest = "#232b40"
on_surface = "#e8ecf5"
on_surface_variant = "#9aa4b8"
outline = "#5a6888"
outline_variant = "#28304a"
accent = "#4ac9fc"                    # the selected row's light blue (measured peak #4ac9fc)
accent_container = "#1a3449"            # the orbs' halo
on_accent_container = "#cde0fa"
secondary = "#c8cfde"                 # silver
tertiary = "#7b88f0"                  # deep blue, lifted for contrast
warning = "#e8c070"
error = "#e8685c"

# Light (K53: every palette has both schemes): the memory-card browser in daylight: silver-white with tower blue.
[light]
surface = "#e6e9f0"
surface_container_lowest = "#f5f7fb"
surface_container_low = "#edf0f6"
surface_container = "#dfe3ec"
surface_container_high = "#d2d8e4"
surface_container_highest = "#c4ccdb"
on_surface = "#10141f"
on_surface_variant = "#3e4860"
outline = "#6a7898"
outline_variant = "#b6c0d4"
accent = "#2a5ab0"
accent_container = "#c8d8f4"
on_accent_container = "#0a1e44"
secondary = "#4a5470"
tertiary = "#3a46c0"
warning = "#8a5a00"
error = "#b8382c"
