# Vibrancy — macOS 11 Big Sur – 14 Sonoma: the system colours Apple publishes (light and dark), the window and sidebar
# greys under vibrancy, the traffic lights' red, yellow and green without gloss, the pale tooltip, a deep blue-violet
# desk for the lock screen. W53.4 (docs/ux/styles.md §6). Meant for look `vibrancy`. (Session ≤ 17 this was `aqua`'s
# palette: aqua is Mac OS X 10.x now.)
name = "vibrancy"
kind = "pair"
description = "macOS graphite and silver with system blue (decor vibrancy)"

[dark]
surface = "#1e1e1e"
surface_container_lowest = "#141414"
