# Aqua — a macOS-like look: graphite / silver grounds that let the wallpaper talk, system blue accent (Apple's
# published system colours). After shellseikatsu's `Macos` preset (W25, K50), which takes muted matugen colours.
# Meant for decor `aqua` (frame `sheen`).
name = "aqua"
kind = "pair"
description = "Graphite and silver with system blue (decor aqua)"

[dark]
surface = "#1e1e1e"
surface_container_lowest = "#141414"
surface_container_low = "#232323"
surface_container = "#2c2c2e"
surface_container_high = "#3a3a3c"
surface_container_highest = "#48484a"
on_surface = "#f5f5f7"
on_surface_variant = "#a1a1a6"
outline = "#7c7c80"
outline_variant = "#48484a"
accent = "#0a84ff"
secondary = "#bf5af2"
tertiary = "#30d158"
warning = "#ffd60a"
error = "#ff453a"

[light]
surface = "#f5f5f7"
surface_container_lowest = "#ffffff"
surface_container_low = "#fafafc"
surface_container = "#ffffff"
surface_container_high = "#e8e8ed"
surface_container_highest = "#d2d2d7"
on_surface = "#1d1d1f"
on_surface_variant = "#6e6e73"
outline = "#8e8e93"
outline_variant = "#d2d2d7"
accent = "#0066cc"
secondary = "#8944ab"
tertiary = "#248a3d"
warning = "#a05a00"
error = "#d70015"
