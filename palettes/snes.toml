# SNES — console-plastic grey, US-purple buttons, the logo's red, yellow and green as spice. Light, and dark (K53). Roles after
# shellseikatsu `_snesPalette()` (W25, K50). Meant for decor `snes` (frame `snes`).
name = "snes"
kind = "pair"
description = "Console grey and US purple (decor snes)"

[light]
surface = "#b8b9b4"
surface_container_lowest = "#cdcec9"
surface_container_low = "#c2c3be"
surface_container = "#cdcec9"
surface_container_high = "#c2c3be"
surface_container_highest = "#aeafaa"
on_surface = "#1e1e26"
on_surface_variant = "#3a3a44"
outline = "#54545e"
outline_variant = "#8e8f8a"
accent = "#4f43ae"                    # US purple
accent_container = "#8a80dc"
on_accent_container = "#161040"
secondary = "#a8231b"                 # logo red
tertiary = "#6e4c00"                  # logo yellow, darkened for text on grey
warning = "#6e4c00"
error = "#a8231b"
success = "#1f6e2c"                   # logo green
line = "#2e2e36"
ring = "#dcddd8"

# Dark (K53: every palette has both schemes): the console in charcoal: dark plastic, lilac buttons, the logo's red, yellow and green.
[dark]
surface = "#2a2b2f"
surface_container_lowest = "#1e1f22"
surface_container_low = "#25262a"
surface_container = "#303136"
surface_container_high = "#393a40"
surface_container_highest = "#44454c"
on_surface = "#e4e5e0"
on_surface_variant = "#b8b9b4"
outline = "#8e8f8a"
outline_variant = "#4a4b52"
accent = "#a89cf0"
accent_container = "#4f43ae"
on_accent_container = "#ece8ff"
secondary = "#e8605a"
tertiary = "#e8c040"
warning = "#e8c040"
error = "#f06058"
success = "#5ac46a"
line = "#0e0e12"
ring = "#54555c"
