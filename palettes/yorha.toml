# YoRHa — NieR:Automata's menus (W53.6, docs/ux/styles.md §9.2): faded parchment, near-monochrome dark brown-grey ink. Light, and dark (K53). Roles
# after shellseikatsu `_nierPalette()` (W25, K50). Meant for the look `yorha` (frame `yorha`).
name = "yorha"
kind = "pair"
description = "Parchment and olive ink (decor yorha)"

[light]
surface = "#d6d1bb"                   # the menu's parchment (the brief's #dad4bb, a shade deeper under the grid)
surface_container_lowest = "#e3dec8"
surface_container_low = "#dcd7c1"
surface_container = "#d1ccb5"
surface_container_high = "#c4bea6"    # the pale band under every list row
surface_container_highest = "#b5af96"
on_surface = "#4e4b42"                # dark brown-grey ink; the selection block
on_surface_variant = "#625e52"
outline = "#7a7565"
outline_variant = "#b0aa92"
accent = "#4e4b42"
accent_container = "#4e4b42"
on_accent_container = "#dad4bb"
secondary = "#6b6657"
tertiary = "#575346"
warning = "#6e4a10"
error = "#9a3b2c"                     # the rare red of a warning
line = "#4e4b42"
ring = "#dad4bb"
title = "#c4bea6"
title_end = "#c4bea6"
title_inactive = "#d1ccb5"
title_inactive_end = "#d1ccb5"
on_title = "#4e4b42"
desk = "#cdc8b0"
info = "#e3dec8"
on_info = "#4e4b42"

# Dark (K53: every palette has both schemes): the black-box menus of the game's dark screens: olive-black ground, parchment ink.
[dark]
surface = "#262520"
surface_container_lowest = "#1b1a16"
surface_container_low = "#211f1b"
surface_container = "#2b2a24"
surface_container_high = "#35332c"
surface_container_highest = "#403d35"
on_surface = "#dad5be"
on_surface_variant = "#b8b29c"
outline = "#8a8572"
outline_variant = "#4a473d"
accent = "#c9c5b0"
accent_container = "#4e4b41"
on_accent_container = "#dad5be"
secondary = "#aba68d"
tertiary = "#c2bca2"
warning = "#d8a850"
error = "#d8705e"
line = "#dad5be"
ring = "#3e3b33"
