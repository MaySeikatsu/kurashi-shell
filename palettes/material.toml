# Material — the Material 3 baseline scheme (m3.material.io, seed #6750A4): tonal containers carry depth, no
# shadows. After shellseikatsu's `Material` preset (W25, K50), which takes matugen colours; this is the fixed
# baseline (palette `wallpaper` gives the dynamic one). Meant for decor `material`.
name = "material"
kind = "pair"
description = "Material 3 baseline (decor material)"

[dark]
surface = "#141218"
surface_container_lowest = "#0f0d13"
surface_container_low = "#1d1b20"
surface_container = "#211f26"
surface_container_high = "#2b2930"
surface_container_highest = "#36343b"
on_surface = "#e6e0e9"
on_surface_variant = "#cac4d0"
outline = "#938f99"
outline_variant = "#49454f"
accent = "#d0bcff"
on_accent = "#381e72"
accent_container = "#4f378b"
on_accent_container = "#eaddff"
secondary = "#ccc2dc"
tertiary = "#efb8c8"
warning = "#e8c26b"
error = "#f2b8b5"

[light]
surface = "#fef7ff"
surface_container_lowest = "#ffffff"
surface_container_low = "#f7f2fa"
