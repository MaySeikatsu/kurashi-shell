# Aero — Windows 7: cool glassy blue-white surfaces over blur, aero-blue accent. Light, and dark (K53). Roles after
# shellseikatsu `_win7Palette()` (W25, K50). Meant for decor `aero` (frame `aero`).
name = "aero"
kind = "pair"
description = "Aero glass blue-white (decor aero)"

[light]
surface = "#dce9f2"
surface_container_lowest = "#f4fafe"
surface_container_low = "#e8f1f8"
surface_container = "#e8f1f8"
