on_surface_variant = "#c9c8e0"
line = "#121120"
ring = "#e4e4ec"

[light]
surface = "#f3fbf9"
on_surface = "#232235"
accent = "#e2457f"
secondary = "#00a99c"
tertiary = "#6e6d94"
