# セカイ sekai — pop pastels on paper, every block outlined in ink (K42; inspired by SekaiPop's
# Virtual Singer unit theme, INSPIRATION.md). Meant for chrome `keycap` (decor `sekai`).
name = "sekai"
kind = "pair"
description = "Pop pastels with ink outlines (decor sekai)"

[dark]
surface = "#232235"
on_surface = "#f3fbf9"
accent = "#ff75ac"         # pink
secondary = "#04e6d8"      # miku teal
tertiary = "#b3b2d4"       # lavender
warning = "#ffe066"
surface_container = "#2c2b42"
