# matugen-generated Alacritty color scheme
# Import this file from your alacritty.toml:
#   import = ["~/.config/alacritty/colors.toml"]

[colors.primary]
background = "{{term.background.hex}}"
foreground = "{{term.foreground.hex}}"

[colors.cursor]
text   = "{{term.cursor_text.hex}}"
cursor = "{{term.cursor.hex}}"

[colors.vi_mode_cursor]
text   = "{{colors.surface.default.hex}}"
cursor = "{{colors.secondary.default.hex}}"

[colors.selection]
background = "{{term.selection_background.hex}}"
text       = "{{term.selection_foreground.hex}}"

[colors.normal]
black   = "{{term.color0.hex}}"
red     = "{{term.color1.hex}}"
green   = "{{term.color2.hex}}"
yellow  = "{{term.color3.hex}}"
blue    = "{{term.color4.hex}}"
magenta = "{{term.color5.hex}}"
cyan    = "{{term.color6.hex}}"
white   = "{{term.color7.hex}}"

[colors.bright]
black   = "{{term.color8.hex}}"
red     = "{{term.color9.hex}}"
green   = "{{term.color10.hex}}"
yellow  = "{{term.color11.hex}}"
blue    = "{{term.color12.hex}}"
magenta = "{{term.color13.hex}}"
cyan    = "{{term.color14.hex}}"
white   = "{{term.color15.hex}}"
# The shell's monospaced font while Monospaced font in apps is on (K104); blank otherwise.
{{alacritty.font}}
