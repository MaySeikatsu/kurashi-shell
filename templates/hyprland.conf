# Written by kurashid from the theme (K49). Do not edit: it is rewritten.
# Source it at the end of ~/.config/hypr/hyprland.conf, after your own general and decoration blocks:
#   source = ~/.config/hypr/kurashi.conf

general {
    {{frame.hyprland}}
    col.active_border = rgb({{colors.primary.default.hex_stripped}})
    col.inactive_border = rgb({{colors.outline.default.hex_stripped}})
}

group {
    col.border_active = rgb({{colors.primary.default.hex_stripped}})
    col.border_inactive = rgb({{colors.outline.default.hex_stripped}})
    col.border_locked_active = rgb({{colors.tertiary.default.hex_stripped}})
    col.border_locked_inactive = rgb({{colors.outline.default.hex_stripped}})
}

decoration {
    rounding = {{shape.radius}}
    {{opacity.hyprland}}
    shadow {
        color = rgba({{colors.shadow.default.hex_stripped}}70)
    }
}

misc {
    background_color = rgb({{colors.surface.default.hex_stripped}})
}

# "Window animations": the shell's motion (off: Hyprland keeps its own).
{{motion.hyprland}}

# "Titlebars": needs the hyprbars plugin loaded (Hyprland draws no titlebars itself).
{{titlebar.hyprland}}
