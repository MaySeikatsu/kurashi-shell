# The desktop settings the shell writes for the apps that follow it (K49, W34): gsettings, not a file. Only a value that
# differs from the current one is set; a line whose value is empty (no icon theme chosen) is left alone. Quotes are
# GVariant text, as gsettings wants them.
[org.gnome.desktop.interface]
color-scheme='{{gsettings.color_scheme}}'
font-name='{{fonts.ui_gtk}}'
monospace-font-name='{{fonts.mono_gtk}}'
icon-theme='{{icons.theme}}'
