# matugen-generated foot terminal color scheme
# Include this file from your foot.ini:
#   include=~/.config/foot/theme.ini
# (foot 1.28 knows no [colors]: a section per colour theme, the shell's scheme in both.)
[colors-dark]
background={{term.background.hex_stripped}}
foreground={{term.foreground.hex_stripped}}
selection-background={{term.selection_background.hex_stripped}}
selection-foreground={{term.selection_foreground.hex_stripped}}
regular0={{term.color0.hex_stripped}}
regular1={{term.color1.hex_stripped}}
regular2={{term.color2.hex_stripped}}
regular3={{term.color3.hex_stripped}}
regular4={{term.color4.hex_stripped}}
regular5={{term.color5.hex_stripped}}
regular6={{term.color6.hex_stripped}}
regular7={{term.color7.hex_stripped}}
bright0={{term.color8.hex_stripped}}
bright1={{term.color9.hex_stripped}}
bright2={{term.color10.hex_stripped}}
bright3={{term.color11.hex_stripped}}
bright4={{term.color12.hex_stripped}}
bright5={{term.color13.hex_stripped}}
bright6={{term.color14.hex_stripped}}
bright7={{term.color15.hex_stripped}}

[colors-light]
background={{term.background.hex_stripped}}
foreground={{term.foreground.hex_stripped}}
