# ps2's layout preset (W53.5, K80 Decided 9; docs/ux/styles.md §8): the shell as the PS2 dashboard — a thin silver strip
# along the top with the memory-card island at its start and the clock at its end (the dashboard's clock top right), the
# browser's icon row as the dock along the bottom, toasts a glowing line low on the screen (the look's
# `toast.place = bottom`). Offered with the style ("Also use its layout"), never applied by itself (K45).
schema_version = 7

[theme]
style = "ps2"

[layout]
draw = "connected"

[bar]
height = 32

[edges.top]
bar = true
start = ["island", "launcher"]
center = []
end = ["mods", "recorder", "tray", "volume", "quick", "clock"]

[dock]
enabled = true
edge = "bottom"
visibility = "always"
