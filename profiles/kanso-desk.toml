# kanso's layout preset (W53.8, K80 Decided 9; docs/ux/styles.md "kanso"): the shell's plain form is its own reference
# layout — the bar along the top, joined to the edge by rounded fillets (dynamic), the workspaces and windows at its
# start, the island in the middle, the levels, the clock, quick settings and the tray at its end, the desk off. Loading it
# puts a changed layout back to the defaults kanso is measured on (K53). Offered with the style ("Also use its layout"),
# never applied by itself (K45).
schema_version = 7

[theme]
style = "kanso"

[layout]
draw = "dynamic"

[bar]
height = 32

[edges.top]
bar = true
start = ["sidebar_left", "workspaces", "windows"]
center = ["island"]
end = ["volume", "mods", "recorder", "keyboard", "clock", "quick", "tray", "sidebar_right"]

[edges.bottom]
bar = false
start = []
center = []
end = []

[desktop]
enabled = false
