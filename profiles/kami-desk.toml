# kami's layout preset (W53.7, K80 Decided 9; docs/ux/styles.md §9): the screen as a notebook page — the bar as the
# page's header line along the top, flush with the edge (connected, straight corners, as a printed header rule), and the
# desk on the left like a planner's margin column: the time, then the month. Offered with the style ("Also use its
# layout"), never applied by itself (K45).
schema_version = 7

[theme]
style = "kami"

[layout]
draw = "connected"

[bar]
height = 34

[desktop]
enabled = true
side = "left"
media = false
weather = false
