# hallownest's layout preset (W53.6, K80): Hollow Knight's HUD — a dark shade along the top fading downward, the MENU
# word with its fleur and the workspaces at its start (where the game keeps its masks), the island in the middle, the
# tray and the clock at its end (docs/ux/styles.md §9.4). Offered with the style ("Also use its layout"), never applied
# by itself (K45).
schema_version = 7

[theme]
style = "hallownest"

[bar]
height = 44

[edges.top]
bar = true
start = ["launcher", "workspaces"]
center = ["island"]
end = ["volume", "tray", "quick", "clock"]
