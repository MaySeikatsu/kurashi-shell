# aqua's layout preset (W53.0b, K80; W53.4): the 22 px menu bar along the top — our mark's menu first, the island in the
# middle, the levels, the tray and the clock at the end, as Mac OS X 10.2–10.4's menu extras — and the Dock floating at
# the bottom with its icons on the shelf (the menu bar height measured on a 1:1 Jaguar capture, docs/ux/styles.md §5).
# Offered with the style ("Also use its layout"), never applied by itself (K45).
schema_version = 7

[theme]
style = "aqua"

[bar]
height = 22

[edges.top]
bar = true
start = ["launcher", "workspaces"]
center = ["island"]
end = ["volume", "mods", "recorder", "keyboard", "tray", "quick", "clock"]

[dock]
enabled = true
edge = "bottom"
visibility = "always"
draw = "floating"
icon_size = 48
