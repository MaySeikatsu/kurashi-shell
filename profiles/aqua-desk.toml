# aqua's layout preset (W53.0b, K80): a menu bar along the top — the menu mark first, the island in the middle, the
# levels, the tray and the clock at the end — and the dock along the bottom, as the Mac OS X desk had it. Offered with
# the style ("Also use its layout"), never applied by itself (K45).
schema_version = 7

[theme]
style = "aqua"

[edges.top]
bar = true
start = ["launcher", "workspaces"]
center = ["island"]
end = ["volume", "mods", "recorder", "keyboard", "tray", "quick", "clock"]

[dock]
enabled = true
edge = "bottom"
visibility = "always"
