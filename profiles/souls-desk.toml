# souls's layout preset (W53.6, K80): Dark Souls' HUD keeps the screen clear — one dark shade along the bottom fading
# upward over a gold hairline, the MENU word at its start, the island in the middle and the clock at its end where the
# game counts its souls (docs/ux/styles.md §9.3). Offered with the style ("Also use its layout"), never applied by itself
# (K45).
schema_version = 7

[theme]
style = "souls"

[bar]
height = 44

[edges.top]
bar = false
start = []
center = []
end = []

[edges.bottom]
bar = true
start = ["launcher", "workspaces"]
center = ["island"]
end = ["volume", "tray", "quick", "clock"]
