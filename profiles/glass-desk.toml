# glass's layout preset (W53.8, K80 Decided 9; docs/ux/styles.md "glass"; after Vitreus/pleamar): frosted islands that
# float a gap away from every edge with their soft shadow, a slightly taller bar for the squircle keys, the clock and the
# month on the desk at the left and nothing else on it. Offered with the style ("Also use its layout"), never applied by
# itself (K45).
schema_version = 7

[theme]
style = "glass"

[layout]
draw = "floating"

[bar]
height = 38

[desktop]
enabled = true
side = "left"
media = false
weather = false
