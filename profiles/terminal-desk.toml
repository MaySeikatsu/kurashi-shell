# terminal's layout preset (W53.8, K80 Decided 9; docs/ux/styles.md "terminal"): the shell as a terminal multiplexer's
# screen — one slim status line along the bottom, flush to the edges with square corners (tmux's and screen's status
# bar: the workspaces as its window list at the start, the island's line in the middle, the levels, tray and the clock at
# the end), compact spacing, nothing on the desk. Offered with the style ("Also use its layout"), never applied by itself
# (K45).
schema_version = 7

[theme]
style = "terminal"
density = "compact"

[layout]
draw = "connected"

[bar]
height = 26

# The bar on the bottom edge with the top bar's modules (K71); the top edge without bar or modules.
[edges.top]
bar = false
start = []
center = []
end = []

[edges.bottom]
bar = true
start = ["sidebar_left", "workspaces", "windows"]
center = ["island"]
end = ["volume", "mods", "recorder", "keyboard", "tray", "quick", "clock", "sidebar_right"]

[desktop]
enabled = false
