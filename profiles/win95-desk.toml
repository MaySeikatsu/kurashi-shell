# win95's layout preset (W53.0b, K80): a taskbar along the bottom — the start button first, the window list, the island,
# then the tray well and the clock — as the Windows 98 desk had it, 28 px tall. Offered with the style ("Also use its layout"),
# never applied by itself (K45).
schema_version = 7

[theme]
style = "win95"

# 98's taskbar: 28 px, the start button and task buttons 22 px inside it (measured, docs/ux/styles.md §1).
[bar]
height = 28

[edges.top]
bar = false
# Nothing left at the top: an edge's modules stand there on their own without a bar (K71).
start = []
center = []
end = []

[edges.bottom]
bar = true
start = ["launcher", "windows"]
center = ["island"]
end = ["volume", "mods", "recorder", "keyboard", "quick", "tray", "clock"]
