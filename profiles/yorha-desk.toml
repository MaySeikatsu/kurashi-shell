# yorha's layout preset (W53.6, K80): NieR:Automata's menu header — the tab band along the top with the MENU tab first
# and the workspaces as tabs, the island in the middle, the levels, the tray and the clock at its end, the thick-and-thin
# rule under it (docs/ux/styles.md §9.2). Offered with the style ("Also use its layout"), never applied by itself (K45).
schema_version = 7

[theme]
style = "yorha"

[bar]
height = 38

[edges.top]
bar = true
start = ["launcher", "workspaces"]
center = ["island"]
end = ["volume", "mods", "recorder", "keyboard", "tray", "quick", "clock"]
