# fluent's layout preset (W53.3, K80): Windows 11's taskbar along the bottom, 48 px — the start button and the window
# list centred together, the island at the start where 11 keeps its widgets button, and at the end the tray's chevron,
# the input language, the grouped quick-settings button, the clock (its calendar) and the notification centre (the right
# sidebar). Offered with the style ("Also use its layout"), never applied by itself (K45).
schema_version = 7

[theme]
style = "fluent"

# 11's taskbar: 48 px, its buttons 40 px inside it.
[bar]
height = 48

[edges.top]
bar = false
# Nothing left at the top: an edge's modules stand there on their own without a bar (K71).
start = []
center = []
end = []

[edges.bottom]
bar = true
start = ["island"]
center = ["launcher", "windows"]
end = ["mods", "recorder", "tray", "keyboard", "volume", "quick", "clock", "sidebar_right"]

# 11's notification centre: the notifications over the calendar, floating at the bottom right, 360 px wide (the look's
# `centre.form = flyouts` makes each section a flyout of its own). The quick tiles stay in Quick Settings.
[sidebar.right]
sections = ["notifications", "calendar"]
width = 360
draw = "floating"
