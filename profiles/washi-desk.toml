# washi's layout preset (W53.7, K80 Decided 9; docs/ux/styles.md §9): the screen as a mounted scroll (掛け軸) — a paper
# frame round the screen as a scroll's mounting, a slim top bar with the island in its middle, airy spacing, and the
# clock and the month standing on the desk at the right like a calendar on paper. Offered with the style ("Also use its
# layout"), never applied by itself (K45).
schema_version = 7

[theme]
style = "washi"
density = "airy"

[layout]
draw = "dynamic"

[layout.frame]
enabled = true
thickness = 10

[bar]
height = 32

[desktop]
enabled = true
side = "right"
media = false
weather = false
