# snes's layout preset (W53.5, K80 Decided 9; docs/ux/styles.md §7): the shell as a 16-bit RPG's battle screen — the bar
# a HUD strip along the bottom (the party-status window: the command menu's button and the workspaces at its
# start, the island's text box in the middle, the volume, tray, quick settings and clock at its end), toasts as the text
# box just above it (the look's `toast.place = bottom`). Offered with the style ("Also use its layout"), never applied by
# itself (K45).
schema_version = 7

[theme]
style = "snes"

[layout]
draw = "connected"

[bar]
height = 48

[edges.top]
bar = false
start = []
center = []
end = []

[edges.bottom]
bar = true
start = ["launcher", "workspaces"]
center = ["island"]
end = ["volume", "mods", "recorder", "tray", "quick", "clock"]
