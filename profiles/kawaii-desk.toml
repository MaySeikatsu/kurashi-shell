# kawaii's layout preset (W53.6, K80): Needy Streamer Overload's pastel desktop — a taskbar along the bottom (measured
# 47 px at 1080p, a white line along its top) with the START box first, the window list, the island, then the tray and the
# clock (docs/ux/styles.md §9.1). Offered with the style ("Also use its layout"), never applied by itself (K45).
schema_version = 7

[theme]
style = "kawaii"

[bar]
height = 46

[edges.top]
bar = false
start = []
center = []
end = []

[edges.bottom]
bar = true
start = ["launcher", "windows"]
center = ["island"]
end = ["volume", "mods", "recorder", "keyboard", "quick", "tray", "clock"]
