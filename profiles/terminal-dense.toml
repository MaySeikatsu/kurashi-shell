# A terminal's desktop: ink lines, a slim bar at the bottom, compact spacing, no desk.
schema_version = 3

[theme]
style = "terminal"
density = "compact"

[bar]
height = 28

# The bar on the bottom edge with the top bar's modules (K71); the top edge without bar or modules.
[edges.top]
bar = false
start = []
center = []
end = []

[edges.bottom]
bar = true
start = ["sidebar_left", "workspaces", "windows"]
center = ["island"]
end = ["volume", "mods", "recorder", "keyboard", "clock", "quick", "tray", "sidebar_right"]

[desktop]
enabled = false
