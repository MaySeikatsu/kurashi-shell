[package]
name = "kurashi-mod-calendar"
description = "Calendar native mod (W27): events from local .ics files and folders (vdirsyncer/khal storage), ICS feed URLs (cached for offline) and khal, expanded into days for the clock card, the desk and the bar (docs/ux/calendar.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
kurashi-mod-api = { path = "../kurashi-mod-api" }
# The system's zoneinfo first, a bundled copy where there is none (the nix build sandbox, minimal systems).
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
notify = "8"
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "fs"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
