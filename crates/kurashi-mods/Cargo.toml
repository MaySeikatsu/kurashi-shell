[package]
name = "kurashi-mods"
description = "Mod manifests, discovery and live enable/disable registry (K1); data only, no Luau/renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
thiserror.workspace = true
semver = { version = "1", features = ["serde"] }
# The catalogue (K155, W98): a mod tree's hash is the one Nix computes (SHA-256 over its NAR), so one hash serves both routes.
sha2 = "0.10"
base64 = "0.22"
# One validator for records (K38, rule 3): a mod's `records` default goes through the schema's check.
kurashi-schema = { path = "../kurashi-schema" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
