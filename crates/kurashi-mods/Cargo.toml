[package]
name = "kurashi-mods"
description = "Mod manifests, discovery and live enable/disable registry (K1); data only, no Luau/renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
semver = { version = "1", features = ["serde"] }
# One validator for records (K38, rule 3): a mod's `records` default goes through the schema's check.
kurashi-schema = { path = "../kurashi-schema" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
