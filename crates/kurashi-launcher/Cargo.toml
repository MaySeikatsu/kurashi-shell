[package]
name = "kurashi-launcher"
description = "Launcher data side: desktop-entry index, fuzzy+frecency ranking, spec-correct launch"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
inotify = { version = "0.11", default-features = false }
# Clipboard image thumbnails (W26); the formats cliphist stores and the theme crate already reads.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
