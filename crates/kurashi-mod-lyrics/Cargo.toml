[package]
name = "kurashi-mod-lyrics"
description = "Lyrics native mod (K47): synced lyrics from LRCLIB for the track the media views show, cached per track, fetched only on a track change while subscribed (docs/ux/lyrics.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
kurashi-mod-api = { path = "../kurashi-mod-api" }
serde_json.workspace = true
tokio.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
# The fake MPRIS player of mods/lyrics/test-lyrics.sh (examples/fake_mpris.rs).
zbus = { version = "5", default-features = false, features = ["tokio"] }

[lints]
workspace = true
