[package]
name = "kurashid"
description = "Kurashi daemon: owns state, config, theming, services, actions and mods (K2)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kurashi-core.workspace = true
kurashi-ipc.workspace = true
kurashi-compositor = { path = "../kurashi-compositor" }
tokio-stream = "0.1"
futures-util = "0.3"
kurashi-island = { path = "../kurashi-island" }
kurashi-services = { path = "../kurashi-services" }
kurashi-tray = { path = "../kurashi-tray" }
kurashi-config = { path = "../kurashi-config" }
kurashi-schema = { path = "../kurashi-schema" }
notify = "8"
kurashi-theme = { path = "../kurashi-theme" }
kurashi-texture = { path = "../kurashi-texture" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
chrono.workspace = true
kurashi-launcher = { path = "../kurashi-launcher" }
kurashi-notify = { path = "../kurashi-notify" }
kurashi-mods = { path = "../kurashi-mods" }
kurashi-mod-api = { path = "../kurashi-mod-api" }
kurashi-mod-weather = { path = "../kurashi-mod-weather" }
kurashi-mod-sysmon = { path = "../kurashi-mod-sysmon" }
kurashi-mod-wallpaper = { path = "../kurashi-mod-wallpaper" }
kurashi-mod-webdock = { path = "../kurashi-mod-webdock" }
kurashi-mod-tasks = { path = "../kurashi-mod-tasks" }
kurashi-mod-lyrics = { path = "../kurashi-mod-lyrics" }
kurashi-mod-calendar = { path = "../kurashi-mod-calendar" }
kurashi-mod-ai = { path = "../kurashi-mod-ai" }
# The test mod, linked only by the `test-mods` feature (`just mods-live`); default builds do not carry it.
kurashi-mod-hello = { path = "../kurashi-mod-hello", optional = true }
semver = "1"
kurashi-audio = { path = "../kurashi-audio" }
kurashi-auth = { path = "../kurashi-auth", features = ["pam"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
anyhow.workspace = true
serde_json.workspace = true
thiserror.workspace = true
serde.workspace = true
toml = "0.8"
# `process`: host processes (K38, native/hosts.rs); `rustix`: their process groups (SIGTERM, SIGKILL).
tokio = { workspace = true, features = ["process"] }
rustix = { version = "1", features = ["process"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[features]
# W14: every bundled mod and the test mod `hello` through the real daemon (`frontend/test-mods-live.sh`).
test-mods = ["dep:kurashi-mod-hello"]

[dev-dependencies]
# K55: the portal test's private bus directory (os_scheme.rs).
tempfile = "3"
kurashi-config = { path = "../kurashi-config" }
kurashi-theme = { path = "../kurashi-theme" }
kurashi-mod-hello = { path = "../kurashi-mod-hello" }
# K34: a generated picture for palette `wallpaper` (theme.rs tests).
image = { version = "0.25", default-features = false, features = ["png"] }
# Paused clock for the background-job tests (native_mods.rs).
tokio = { workspace = true, features = ["test-util"] }
