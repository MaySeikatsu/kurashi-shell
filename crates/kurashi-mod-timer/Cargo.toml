[package]
name = "kurashi-mod-timer"
description = "Timer and pomodoro native mod (K73, docs/ux/timer.md): countdowns and a pomodoro cycle, one deadline in the daemon, the end as a notification and an island face"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
kurashi-mod-api = { path = "../kurashi-mod-api" }
chrono.workspace = true
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
toml = "0.8"
tracing.workspace = true
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
