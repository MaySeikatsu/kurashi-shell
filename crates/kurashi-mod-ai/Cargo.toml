[package]
name = "kurashi-mod-ai"
description = "AI chat native mod (W28): a chat with the user's Ollama server (default), an OpenAI-compatible server or Anthropic, streamed into the mod's document in coarse chunks; conversations saved as JSON; keys from an env var or secret-tool, never from the config (docs/ux/ai.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
kurashi-mod-api = { path = "../kurashi-mod-api" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "fs"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
