name = "aero"
label = "config.choice.decor.aero"
# After shellseikatsu `Services/Modes/Win7.qml`, `Widgets/GlassSheen.qml` and `Widgets/SurfaceFrame.qml` (W25;
# Windows 7 "Aero"): translucent glass with a specular sheen in a glass window band, aero blue, Segoe UI.
[recipe]
"theme.colors.palette" = "aero"
"theme.colors.scheme" = "light"
"theme.chrome" = "soft"
"theme.motion.profile" = "calm"
"theme.material.kind" = "glass"
"theme.material.opacity" = 0.78
"theme.shape.corners" = "rounded"
"theme.shape.radius_scale" = 1.0
"theme.typography.family" = ["Segoe UI", "Noto Sans", "DejaVu Sans", "Noto Sans CJK JP", "sans-serif"]
[slots]
frame = "aero"
