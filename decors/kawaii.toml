name = "kawaii"
label = "config.choice.decor.kawaii"
# After shellseikatsu `Services/Modes/Kawaii.qml` and `Widgets/ThemeDecor/KawaiiFrame.qml` (W25; Needy Streamer
# Overload): pastel pink, lavender window chrome with a title band, pixel hearts, rounded friendly type, springs.
[recipe]
"theme.colors.palette" = "kawaii"
"theme.colors.scheme" = "light"
"theme.chrome" = "soft"
"theme.motion.profile" = "lively"
"theme.material.kind" = "solid"
"theme.shape.corners" = "rounded"
"theme.shape.radius_scale" = 0.9
"theme.typography.family" = ["Quicksand", "Comic Neue", "Nunito", "M PLUS Rounded 1c", "Noto Sans CJK JP", "sans-serif"]
[slots]
frame = "kawaii"
