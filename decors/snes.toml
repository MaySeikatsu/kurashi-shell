name = "snes"
label = "config.choice.decor.snes"
# After shellseikatsu `Services/Modes/Snes.qml` and `Widgets/ThemeDecor/SnesFrame.qml` (W25): console-plastic grey,
# hard blocky keys, the logo's four dots and the purple buttons, chunky pixel type, quick motion.
[recipe]
"theme.colors.palette" = "snes"
"theme.colors.scheme" = "light"
"theme.chrome" = "keycap"
"theme.density" = "compact"
"theme.motion.profile" = "calm"
"theme.motion.speed" = 1.6
"theme.material.kind" = "solid"
"theme.shape.corners" = "none"
"theme.typography.family" = ["Press Start 2P", "JetBrains Mono", "Noto Sans Mono CJK JP", "monospace"]
[slots]
frame = "snes"
